# BushyFam Studios – Admin (Decap CMS)
#
# Jeder Text hat ein deutsches und ein englisches Feld. Bilder, Videos und
# Listen gibt es nur einmal und gelten für beide Sprachen.
# Nach dem Speichern baut Netlify die Seite neu – das dauert ein bis zwei Minuten.

backend:
  name: github
  repo: snopebushyfam/bushyfam-studios-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: de

collections:
  # ---------------------------------------------------------------- Projekte
  - name: "projekte"
    label: "Arbeiten (Projekte)"
    label_singular: "Projekt"
    folder: "content/projects"
    create: true
    delete: true
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: title_de
    summary: "{{title_de}} — {{client}}"
    sortable_fields: ["order", "title_de", "client"]
    media_folder: "/assets/uploads/projekte"
    public_folder: "/assets/uploads/projekte"
    fields:
      - { label: "Titel (DE)", name: title_de, widget: string }
      - { label: "Titel (EN)", name: title_en, widget: string, required: false, hint: "Leer lassen = deutscher Text wird angezeigt" }
      - { label: "Kunde", name: client, widget: string, required: false }
      - { label: "Jahr", name: year, widget: string, required: false, hint: "z. B. 2026 – leer lassen, wenn unbekannt" }
      - label: "Kategorie"
        name: category
        widget: select
        options:
          - { label: "Film", value: "video" }
          - { label: "Fotografie", value: "foto" }
          - { label: "Logos & Branding", value: "branding" }
          - { label: "Websites & Digital", value: "digital" }
      - { label: "Adresse der Projektseite", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"], hint: "Erscheint in der Adresszeile, z. B. masons-clips" }
      - { label: "Veröffentlicht", name: published, widget: boolean, default: true, required: false, hint: "Aus = Entwurf: erscheint nirgends auf der Website" }
      - { label: "Auf der Startseite zeigen", name: featured, widget: boolean, default: false, required: false }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10, hint: "Kleinere Zahl steht weiter vorne" }
      - label: "Titelbild"
        name: cover
        widget: object
        fields:
          - { label: "Bild", name: src, widget: image, hint: "Fotos und Filmstandbilder füllen die Fläche; max. 2000 px" }
          - label: "Darstellung"
            name: fit
            widget: select
            required: false
            default: "cover"
            options:
              - { label: "Fläche füllen (Fotos, Filmstandbilder)", value: "cover" }
              - { label: "Bild ganz zeigen (Logos, Grafiken)", value: "contain" }
          - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string }
          - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
      - { label: "Disziplinen (DE)", name: disciplines_de, widget: string, required: false, hint: "Kurze Zeile, z. B. Film · Fotografie · Social Media" }
      - { label: "Disziplinen (EN)", name: disciplines_en, widget: string, required: false }
      - { label: "Kurzbeschreibung (DE)", name: summary_de, widget: text, required: false }
      - { label: "Kurzbeschreibung (EN)", name: summary_en, widget: text, required: false }
      - { label: "Ausführlicher Text (DE)", name: body_de, widget: text, required: false, hint: "Kontext zum Projekt. Leerzeile = neuer Absatz" }
      - { label: "Ausführlicher Text (EN)", name: body_en, widget: text, required: false }
      - label: "Bilder & Filme"
        name: media
        widget: list
        required: false
        hint: "Filme und Bilder erscheinen automatisch als eigene Kapitel; Bilder in einem versetzten Raster (1. groß, 2. klein …)"
        summary: "{{type}}: {{title_de}}{{alt_de}}"
        fields:
          - label: "Art"
            name: type
            widget: select
            options:
              - { label: "Bild", value: "image" }
              - { label: "Film", value: "video" }
            default: "image"
          - { label: "Datei", name: src, widget: file, hint: "Filme bitte als MP4 (H.264) hochladen – iPhone-Videos vorher umwandeln" }
          - { label: "Vorschaubild (nur für Filme)", name: poster, widget: image, required: false }
          - { label: "Titel (DE) – nur für Filme", name: title_de, widget: string, required: false }
          - { label: "Titel (EN) – nur für Filme", name: title_en, widget: string, required: false }
          - { label: "Länge – nur für Filme", name: duration, widget: string, required: false, hint: "z. B. 29 s" }
          - { label: "Hat Ton", name: audio, widget: boolean, required: false, default: false }
          - { label: "Bildbeschreibung (DE) – nur für Bilder", name: alt_de, widget: string, required: false }
          - { label: "Bildbeschreibung (EN) – nur für Bilder", name: alt_en, widget: string, required: false }
          - { label: "Bildunterschrift (DE)", name: caption_de, widget: string, required: false }
          - { label: "Bildunterschrift (EN)", name: caption_en, widget: string, required: false }

  # ---------------------------------------------------------------- Objects in Motion
  - name: "objekte"
    label: "Objects in Motion (Produktgalerie)"
    label_singular: "Objekt"
    folder: "content/objects"
    create: true
    delete: true
    format: "json"
    identifier_field: title_de
    summary: "{{title_de}}"
    sortable_fields: ["order", "title_de"]
    media_folder: "/assets/uploads/objekte"
    public_folder: "/assets/uploads/objekte"
    fields:
      - { label: "Bild", name: image, widget: image, hint: "Am besten freigestellt oder vor dunklem Grund, quadratisch zugeschnitten wirkt am ruhigsten" }
      - { label: "Titel (nur intern, DE)", name: title_de, widget: string, required: false }
      - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
      - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
      - { label: "Anzeigen", name: enabled, widget: boolean, default: true }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Besetzung
  - name: "besetzung"
    label: "Besetzung (Models, DJs …)"
    label_singular: "Person"
    folder: "content/cast"
    create: true
    delete: true
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} — {{role_de}}"
    sortable_fields: ["order", "name", "role_de"]
    media_folder: "/assets/uploads/besetzung"
    public_folder: "/assets/uploads/besetzung"
    fields:
      - { label: "Name oder Künstlername", name: name, widget: string, hint: "Vorname oder Künstlername genügt" }
      - { label: "Adresse der Seite", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"], hint: "z. B. lena oder dj-nova" }
      - { label: "Rolle (DE)", name: role_de, widget: string, hint: "z. B. Model, DJ, Host – gleiche Schreibweise ergibt eine gemeinsame Kategorie" }
      - { label: "Rolle (EN)", name: role_en, widget: string, required: false }
      - { label: "Stadt", name: city, widget: string, required: false }
      - { label: "Kurztext (DE)", name: text_de, widget: text, required: false }
      - { label: "Kurztext (EN)", name: text_en, widget: text, required: false }
      - { label: "Instagram-Adresse", name: instagram, widget: string, required: false }
      - { label: "Instagram-Name", name: instagramHandle, widget: string, required: false }
      - label: "Fotos"
        name: photos
        widget: list
        summary: "{{alt_de}}"
        fields:
          - { label: "Foto", name: src, widget: image }
          - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
          - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
      - { label: "Schriftliche Einwilligung liegt vor", name: consent, widget: boolean, default: false, hint: "Pflicht. Ohne Häkchen erscheint die Person nirgends auf der Website." }
      - { label: "Sichtbar", name: visible, widget: boolean, default: true }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Kunden
  - name: "kunden"
    label: "Kunden & Partner"
    label_singular: "Kunde"
    folder: "content/clients"
    create: true
    delete: true
    format: "json"
    identifier_field: name
    media_folder: "/assets/uploads/kunden"
    public_folder: "/assets/uploads/kunden"
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Logo", name: logo, widget: image, required: false, hint: "Nur einfarbige Logos auf transparentem Grund (PNG/SVG). Ohne Logo erscheint der Name als Schriftzug." }
      - { label: "Website", name: url, widget: string, required: false }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Seiten
  - name: "seiten"
    label: "Seiten & Einstellungen"
    files:
      - name: "settings"
        label: "Allgemein, Einstieg & Filme"
        file: "content/settings.json"
        fields:
          - { label: "Für Suchmaschinen freigeben", name: launch, widget: boolean, default: false, hint: "Erst einschalten, wenn Domain, Impressum und Datenschutz stehen" }
          - { label: "Adresse der Website", name: siteUrl, widget: string, required: false, hint: "z. B. https://bushyfam-studios.de – nötig für Sitemap und Link-Vorschau" }
          - { label: "Studioname", name: brandName, widget: string }
          - { label: "Ort (DE)", name: location_de, widget: string }
          - { label: "Ort (EN)", name: location_en, widget: string }
          - { label: "Einzugsgebiet (DE)", name: reach_de, widget: string }
          - { label: "Einzugsgebiet (EN)", name: reach_en, widget: string }
          - { label: "E-Mail", name: email, widget: string, required: false, hint: "Wird angezeigt, sobald sie eingetragen ist" }
          - { label: "WhatsApp-Nummer", name: whatsapp, widget: string, required: false, hint: "Mit Ländervorwahl, z. B. +49 1514 4930658 – leer lassen, um WhatsApp auszublenden" }
          - { label: "Instagram-Adresse", name: instagramUrl, widget: string, required: false }
          - { label: "Instagram-Name", name: instagramHandle, widget: string, required: false }
          - label: "Suchmaschinen-Text"
            name: seo
            widget: object
            fields:
              - { label: "Seitentitel (DE)", name: title_de, widget: string }
              - { label: "Seitentitel (EN)", name: title_en, widget: string }
              - { label: "Beschreibung (DE)", name: description_de, widget: text, hint: "ca. 150–160 Zeichen" }
              - { label: "Beschreibung (EN)", name: description_en, widget: text }
          - label: "Einstieg"
            name: hero
            widget: object
            fields:
              - { label: "Überschrift Zeile 1 (DE)", name: line1_de, widget: string }
              - { label: "Überschrift Zeile 2 (DE)", name: line2_de, widget: string, required: false, hint: "Optional – leer lassen für eine ruhigere erste Ansicht" }
              - { label: "Überschrift Zeile 1 (EN)", name: line1_en, widget: string }
              - { label: "Überschrift Zeile 2 (EN)", name: line2_en, widget: string, required: false }
              - { label: "Aussage unter dem Namen (DE)", name: text_de, widget: text, hint: "Ein kurzer Satz" }
              - { label: "Aussage unter dem Namen (EN)", name: text_en, widget: text }
              - { label: "Satz am Filmende (DE)", name: outro_de, widget: text, required: false }
              - { label: "Satz am Filmende (EN)", name: outro_en, widget: text, required: false }
              - label: "Film"
                name: video
                widget: object
                hint: "Scrub-optimierte Dateien – Austausch bitte abstimmen"
                fields:
                  - label: "Dateien"
                    name: sources
                    widget: list
                    fields:
                      - { label: "Datei", name: src, widget: file }
                      - { label: "Breite (px)", name: width, widget: number, value_type: int }
                      - { label: "Nur Desktop", name: desktopOnly, widget: boolean, required: false, default: false }
                  - label: "Einzelbilder fürs Handy"
                    name: frames
                    widget: object
                    required: false
                    collapsed: true
                    hint: "Ruckelfreies Scrollen auf Telefonen. Werden automatisch nicht verwendet, sobald der Film ausgetauscht wird (dann läuft das Video)."
                    fields:
                      - { label: "Ordner", name: folder, widget: string, required: false }
                      - { label: "Anzahl Bilder", name: count, widget: number, value_type: int, required: false }
                      - { label: "Gehört zu Datei", name: forVideo, widget: string, required: false }
                  - { label: "Standbild", name: poster, widget: image }
                  - { label: "Breite (px)", name: width, widget: number, value_type: int }
                  - { label: "Höhe (px)", name: height, widget: number, value_type: int }
                  - { label: "Filmbeschreibung (DE)", name: description_de, widget: text }
                  - { label: "Filmbeschreibung (EN)", name: description_en, widget: text }
          - label: "Abschlussfilm"
            name: ending
            widget: object
            fields:
              - { label: "Anzeigen", name: enabled, widget: boolean, default: true }
              - label: "Film"
                name: video
                widget: object
                fields:
                  - label: "Dateien"
                    name: sources
                    widget: list
                    fields:
                      - { label: "Datei", name: src, widget: file }
                      - { label: "Breite (px)", name: width, widget: number, value_type: int }
                      - { label: "Nur Desktop", name: desktopOnly, widget: boolean, required: false, default: false }
                  - { label: "Standbild", name: poster, widget: image }
                  - { label: "Breite (px)", name: width, widget: number, value_type: int }
                  - { label: "Höhe (px)", name: height, widget: number, value_type: int }
                  - { label: "Filmbeschreibung (DE)", name: description_de, widget: text }
                  - { label: "Filmbeschreibung (EN)", name: description_en, widget: text }
          - label: "Showreel"
            name: showreel
            widget: object
            hint: "Erscheint auf der Startseite, sobald eingeschaltet und eine Datei hinterlegt ist"
            fields:
              - { label: "Anzeigen", name: enabled, widget: boolean, default: false }
              - { label: "Film (MP4)", name: src, widget: file, required: false }
              - { label: "Standbild", name: poster, widget: image, required: false }
              - { label: "Länge", name: duration, widget: string, required: false, hint: "z. B. 00:45" }
              - { label: "Titel (DE)", name: title_de, widget: string, required: false }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }

      - name: "home"
        label: "Startseite"
        file: "content/home.json"
        fields:
          - { label: "Überschrift Arbeiten (DE)", name: workTitle_de, widget: string }
          - { label: "Überschrift Arbeiten (EN)", name: workTitle_en, widget: string }
          - { label: "Kurztext über Taha (DE)", name: aboutText_de, widget: text }
          - { label: "Kurztext über Taha (EN)", name: aboutText_en, widget: text }
          - { label: "Abschluss-Überschrift (DE)", name: ctaTitle_de, widget: string }
          - { label: "Abschluss-Überschrift (EN)", name: ctaTitle_en, widget: string }
          - { label: "Abschlusstext (DE)", name: ctaText_de, widget: text }
          - { label: "Abschlusstext (EN)", name: ctaText_en, widget: text }

      - name: "services"
        label: "Leistungen"
        file: "content/services.json"
        fields:
          - { label: "Überschrift (DE)", name: title_de, widget: string, required: false }
          - { label: "Überschrift (EN)", name: title_en, widget: string, required: false }
          - label: "Leistungen"
            name: items
            widget: list
            summary: "{{title_de}}"
            fields:
              - { label: "Begriff (DE)", name: title_de, widget: string }
              - { label: "Begriff (EN)", name: title_en, widget: string, required: false }
              - { label: "Erklärung (DE)", name: text_de, widget: text }
              - { label: "Erklärung (EN)", name: text_en, widget: text, required: false }
              - { label: "Stichworte (DE)", name: tags_de, widget: string, required: false, hint: "z. B. Werbefilme · Reels · Schnitt" }
              - { label: "Stichworte (EN)", name: tags_en, widget: string, required: false }
          - { label: "Zusatzsatz unter den Leistungen (DE)", name: note_de, widget: text, required: false, hint: "z. B. „Mehrere Leistungen zusammen? Gerne – wir setzen es gemeinsam um.“" }
          - { label: "Zusatzsatz unter den Leistungen (EN)", name: note_en, widget: text, required: false }

      - name: "studio"
        label: "Studio (Taha & Stationen)"
        file: "content/studio.json"
        media_folder: "/assets/uploads/studio"
        public_folder: "/assets/uploads/studio"
        fields:
          - { label: "Name", name: name, widget: string }
          - { label: "Rolle (DE)", name: role_de, widget: string }
          - { label: "Rolle (EN)", name: role_en, widget: string }
          - { label: "Großes Statement ganz oben (DE)", name: statement_de, widget: text, required: false, hint: "Ein großer, kurzer Satz – erscheint sehr groß direkt unter dem Namen" }
          - { label: "Großes Statement ganz oben (EN)", name: statement_en, widget: text, required: false }
          - { label: "Einleitung (DE)", name: lead_de, widget: text }
          - { label: "Einleitung (EN)", name: lead_en, widget: text }
          - label: "Porträt"
            name: portrait
            widget: object
            fields:
              - { label: "Bild", name: src, widget: image }
              - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string }
              - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
          - label: "Absätze"
            name: paragraphs
            widget: list
            summary: "{{de}}"
            fields:
              - { label: "Text (DE)", name: de, widget: text }
              - { label: "Text (EN)", name: en, widget: text, required: false }
          - { label: "Überschrift Stationen (DE)", name: stationsTitle_de, widget: string }
          - { label: "Überschrift Stationen (EN)", name: stationsTitle_en, widget: string }
          - label: "Stationen & Projekte"
            name: stations
            widget: list
            required: false
            summary: "{{title_de}}"
            fields:
              - { label: "Zeitangabe (DE)", name: year_de, widget: string, required: false }
              - { label: "Zeitangabe (EN)", name: year_en, widget: string, required: false }
              - label: "Kategorie (optional)"
                name: category
                widget: select
                required: false
                options: ["Art", "Exhibition", "Publishing", "Film", "BushyFam"]
              - { label: "Groß darstellen", name: feature, widget: boolean, default: false, required: false, hint: "Großes Bild mit Text daneben – für die stärksten Momente wie Museum und Buch. Ohne Häkchen: ruhige Textnotiz" }
              - { label: "Titel (DE)", name: title_de, widget: string }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }
              - { label: "Text (DE)", name: text_de, widget: text }
              - { label: "Text (EN)", name: text_en, widget: text, required: false }
              - label: "Bild"
                name: image
                widget: object
                required: false
                fields:
                  - { label: "Bild", name: src, widget: image, required: false }
                  - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
                  - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
              - label: "Link"
                name: link
                widget: object
                required: false
                fields:
                  - { label: "Adresse", name: url, widget: string, required: false }
                  - { label: "Beschriftung (DE)", name: label_de, widget: string, required: false }
                  - { label: "Beschriftung (EN)", name: label_en, widget: string, required: false }
                  - { label: "Hinweis (DE)", name: note_de, widget: string, required: false, hint: "z. B. Werbelink – bei Affiliate-Links Pflicht" }
                  - { label: "Hinweis (EN)", name: note_en, widget: string, required: false }
          - { label: "Überschrift Zusammenarbeit (DE)", name: processTitle_de, widget: string }
          - { label: "Überschrift Zusammenarbeit (EN)", name: processTitle_en, widget: string }
          - label: "Schritte der Zusammenarbeit"
            name: process
            widget: list
            summary: "{{title_de}}"
            fields:
              - { label: "Titel (DE)", name: title_de, widget: string }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }
              - { label: "Text (DE)", name: text_de, widget: text }
              - { label: "Text (EN)", name: text_en, widget: text, required: false }

      - name: "contact"
        label: "Kontaktseite"
        file: "content/contact.json"
        fields:
          - { label: "Überschrift (DE)", name: title_de, widget: string }
          - { label: "Überschrift (EN)", name: title_en, widget: string }
          - { label: "Einleitung (DE)", name: intro_de, widget: text }
          - { label: "Einleitung (EN)", name: intro_en, widget: text }
          - label: "Auswahl „Was brauchst du?“"
            name: options
            widget: list
            summary: "{{de}}"
            fields:
              - { label: "Bezeichnung (DE)", name: de, widget: string }
              - { label: "Bezeichnung (EN)", name: en, widget: string, required: false }

      - name: "legal"
        label: "Impressum & Datenschutz"
        file: "content/legal.json"
        fields:
          - { label: "Impressum (DE)", name: imprint_de, widget: text, required: false, hint: "Leerzeile = neuer Absatz. Eine Zeile, die mit ## beginnt, wird zur Zwischenüberschrift." }
          - { label: "Impressum (EN)", name: imprint_en, widget: text, required: false }
          - { label: "Datenschutz (DE)", name: privacy_de, widget: text, required: false }
          - { label: "Datenschutz (EN)", name: privacy_en, widget: text, required: false }
