# BushyFam Studios – Admin (Decap CMS)
#
# Jeder Text hat ein deutsches und ein englisches Feld. Bilder, Videos und
# Listen gibt es nur einmal und gelten für beide Sprachen.
# Nach dem Speichern baut Netlify die Seite neu – das dauert ein bis zwei Minuten.

backend:
  name: github
  repo: snopebushyfam/bushyfam-studios-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: de

collections:
  # ---------------------------------------------------------------- Projekte
  - name: "projekte"
    label: "Arbeiten (Projekte)"
    label_singular: "Projekt"
    folder: "content/projects"
    create: true
    delete: true
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: title_de
    summary: "{{title_de}} — {{client}}"
    sortable_fields: ["order", "title_de", "client"]
    media_folder: "/assets/uploads/projekte"
    public_folder: "/assets/uploads/projekte"
    fields:
      - { label: "Titel (DE)", name: title_de, widget: string }
      - { label: "Titel (EN)", name: title_en, widget: string, required: false, hint: "Leer lassen = deutscher Text wird angezeigt" }
      - { label: "Titel (TR)", name: title_tr, widget: string, required: false }
      - { label: "Kunde", name: client, widget: string, required: false }
      - { label: "Jahr", name: year, widget: string, required: false, hint: "z. B. 2026 – leer lassen, wenn unbekannt" }
      - label: "Kategorie"
        name: category
        widget: select
        options:
          - { label: "Film", value: "video" }
          - { label: "Fotografie", value: "foto" }
          - { label: "Logos & Branding", value: "branding" }
          - { label: "Websites & Digital", value: "digital" }
      - { label: "Adresse der Projektseite", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"], hint: "Erscheint in der Adresszeile, z. B. masons-clips" }
      - { label: "Veröffentlicht", name: published, widget: boolean, default: true, required: false, hint: "Aus = Entwurf: erscheint nirgends auf der Website" }
      - { label: "Auf der Startseite zeigen", name: featured, widget: boolean, default: false, required: false }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10, hint: "Kleinere Zahl steht weiter vorne" }
      - label: "Titelbild"
        name: cover
        widget: object
        fields:
          - { label: "Bild", name: src, widget: image, hint: "Fotos und Filmstandbilder füllen die Fläche; max. 2000 px" }
          - label: "Darstellung"
            name: fit
            widget: select
            required: false
            default: "cover"
            options:
              - { label: "Fläche füllen (Fotos, Filmstandbilder)", value: "cover" }
              - { label: "Bild ganz zeigen (Logos, Grafiken)", value: "contain" }
          - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string }
          - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
          - { label: "Bildbeschreibung (TR)", name: alt_tr, widget: string, required: false }
      - { label: "Disziplinen (DE)", name: disciplines_de, widget: string, required: false, hint: "Kurze Zeile, z. B. Film · Fotografie · Social Media" }
      - { label: "Disziplinen (EN)", name: disciplines_en, widget: string, required: false }
      - { label: "Disziplinen (TR)", name: disciplines_tr, widget: string, required: false }
      - { label: "Kurzbeschreibung (DE)", name: summary_de, widget: text, required: false }
      - { label: "Kurzbeschreibung (EN)", name: summary_en, widget: text, required: false }
      - { label: "Kurzbeschreibung (TR)", name: summary_tr, widget: text, required: false }
      - { label: "Branche (DE)", name: industry_de, widget: string, required: false, hint: "z. B. Gastronomie, Immobilien – leer oder [TODO: …] = wird nicht angezeigt" }
      - { label: "Branche (EN)", name: industry_en, widget: string, required: false }
      - { label: "Aufgabe (DE)", name: task_de, widget: text, required: false, hint: "Was wollte der Kunde erreichen? Leer oder [TODO: …] = Abschnitt ausgeblendet" }
      - { label: "Aufgabe (EN)", name: task_en, widget: text, required: false }
      - { label: "Lösung (DE)", name: solution_de, widget: text, required: false, hint: "Was BushyFam gemacht hat. Leerzeile = neuer Absatz" }
      - { label: "Lösung (EN)", name: solution_en, widget: text, required: false }
      - { label: "Ergebnis (DE)", name: result_de, widget: text, required: false, hint: "Nur echte Angaben (Zahlen, Einsatz, Feedback). Leer oder [TODO: …] = Abschnitt ausgeblendet" }
      - { label: "Ergebnis (EN)", name: result_en, widget: text, required: false }
      - label: "Kundenzitat (optional)"
        name: quote
        widget: object
        required: false
        collapsed: true
        hint: "Erscheint nur, wenn Zitat UND Name ausgefüllt sind – nur mit Zustimmung des Kunden"
        fields:
          - { label: "Zitat (DE)", name: text_de, widget: text, required: false }
          - { label: "Zitat (EN)", name: text_en, widget: text, required: false }
          - { label: "Name", name: name, widget: string, required: false }
          - { label: "Rolle (DE)", name: role_de, widget: string, required: false, hint: "z. B. Inhaber" }
          - { label: "Rolle (EN)", name: role_en, widget: string, required: false }
      - { label: "Ausführlicher Text (DE)", name: body_de, widget: text, required: false, hint: "Älterer Freitext – wird nur gezeigt, wenn Aufgabe und Lösung leer sind" }
      - { label: "Ausführlicher Text (EN)", name: body_en, widget: text, required: false }
      - { label: "Ausführlicher Text (TR)", name: body_tr, widget: text, required: false }
      - label: "Bilder & Filme"
        name: media
        widget: list
        required: false
        hint: "Filme und Bilder erscheinen automatisch als eigene Kapitel; Bilder in einem versetzten Raster (1. groß, 2. klein …)"
        summary: "{{type}}: {{title_de}}{{alt_de}}"
        fields:
          - label: "Art"
            name: type
            widget: select
            options:
              - { label: "Bild", value: "image" }
              - { label: "Film", value: "video" }
            default: "image"
          - { label: "Datei", name: src, widget: file, hint: "Filme bitte als MP4 (H.264) hochladen – iPhone-Videos vorher umwandeln" }
          - { label: "Vorschaubild (nur für Filme)", name: poster, widget: image, required: false }
          - { label: "Titel (DE) – nur für Filme", name: title_de, widget: string, required: false }
          - { label: "Titel (EN) – nur für Filme", name: title_en, widget: string, required: false }
          - { label: "Titel (TR) – nur für Filme", name: title_tr, widget: string, required: false }
          - { label: "Länge – nur für Filme", name: duration, widget: string, required: false, hint: "z. B. 29 s" }
          - { label: "Hat Ton", name: audio, widget: boolean, required: false, default: false }
          - { label: "Bildbeschreibung (DE) – nur für Bilder", name: alt_de, widget: string, required: false }
          - { label: "Bildbeschreibung (EN) – nur für Bilder", name: alt_en, widget: string, required: false }
          - { label: "Bildbeschreibung (TR) – nur für Bilder", name: alt_tr, widget: string, required: false }
          - { label: "Bildunterschrift (DE)", name: caption_de, widget: string, required: false }
          - { label: "Bildunterschrift (EN)", name: caption_en, widget: string, required: false }
          - { label: "Bildunterschrift (TR)", name: caption_tr, widget: string, required: false }

  # ---------------------------------------------------------------- Objects in Motion
  - name: "objekte"
    label: "Objects in Motion (derzeit nicht auf der Startseite)"
    label_singular: "Objekt"
    folder: "content/objects"
    create: true
    delete: true
    format: "json"
    identifier_field: title_de
    summary: "{{title_de}}"
    sortable_fields: ["order", "title_de"]
    media_folder: "/assets/uploads/objekte"
    public_folder: "/assets/uploads/objekte"
    fields:
      - { label: "Bild", name: image, widget: image, hint: "Am besten freigestellt oder vor dunklem Grund, quadratisch zugeschnitten wirkt am ruhigsten" }
      - { label: "Titel (nur intern, DE)", name: title_de, widget: string, required: false }
      - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
      - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
      - { label: "Bildbeschreibung (TR)", name: alt_tr, widget: string, required: false }
      - { label: "Anzeigen", name: enabled, widget: boolean, default: true }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Besetzung
  - name: "besetzung"
    label: "Besetzung (Models, DJs …)"
    label_singular: "Person"
    folder: "content/cast"
    create: true
    delete: true
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} — {{role_de}}"
    sortable_fields: ["order", "name", "role_de"]
    media_folder: "/assets/uploads/besetzung"
    public_folder: "/assets/uploads/besetzung"
    fields:
      - { label: "Name oder Künstlername", name: name, widget: string, hint: "Vorname oder Künstlername genügt" }
      - { label: "Adresse der Seite", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"], hint: "z. B. lena oder dj-nova" }
      - { label: "Rolle (DE)", name: role_de, widget: string, hint: "z. B. Model, DJ, Host – gleiche Schreibweise ergibt eine gemeinsame Kategorie" }
      - { label: "Rolle (EN)", name: role_en, widget: string, required: false }
      - { label: "Rolle (TR)", name: role_tr, widget: string, required: false }
      - { label: "Stadt", name: city, widget: string, required: false }
      - { label: "Kurztext (DE)", name: text_de, widget: text, required: false }
      - { label: "Kurztext (EN)", name: text_en, widget: text, required: false }
      - { label: "Kurztext (TR)", name: text_tr, widget: text, required: false }
      - { label: "Instagram-Adresse", name: instagram, widget: string, required: false }
      - { label: "Instagram-Name", name: instagramHandle, widget: string, required: false }
      - label: "Weitere Angaben (optional)"
        name: facts
        widget: list
        required: false
        summary: "{{label_de}}: {{value}}"
        hint: "Nur echte, mit der Person abgesprochene Angaben – z. B. Größe, Sprachen. Leere Einträge werden nicht gezeigt."
        fields:
          - { label: "Bezeichnung (DE)", name: label_de, widget: string, hint: "z. B. Größe" }
          - { label: "Bezeichnung (EN)", name: label_en, widget: string, required: false, hint: "z. B. Height" }
          - { label: "Bezeichnung (TR)", name: label_tr, widget: string, required: false }
          - { label: "Wert", name: value, widget: string, hint: "z. B. 172 cm" }
      - label: "Showreel / Video (optional)"
        name: video
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Video (MP4)", name: src, widget: file, required: false }
          - { label: "Vorschaubild", name: poster, widget: image, required: false }
      - label: "Fotos"
        name: photos
        widget: list
        summary: "{{alt_de}}"
        fields:
          - { label: "Foto", name: src, widget: image }
          - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
          - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
          - { label: "Bildbeschreibung (TR)", name: alt_tr, widget: string, required: false }
      - { label: "Schriftliche Einwilligung liegt vor", name: consent, widget: boolean, default: false, hint: "Pflicht. Ohne Häkchen erscheint die Person nirgends auf der Website." }
      - { label: "Sichtbar", name: visible, widget: boolean, default: true }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Kunden
  - name: "kunden"
    label: "Kunden & Partner"
    label_singular: "Kunde"
    folder: "content/clients"
    create: true
    delete: true
    format: "json"
    identifier_field: name
    media_folder: "/assets/uploads/kunden"
    public_folder: "/assets/uploads/kunden"
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Logo", name: logo, widget: image, required: false, hint: "Logo auf transparentem Grund (PNG/WebP/SVG), ohne weißen Kasten. Erscheint in Graustufen, farbig beim Darüberfahren. Ohne Logo erscheint der Name als Schriftzug." }
      - { label: "Website", name: url, widget: string, required: false }
      - { label: "In der Logo-Wand zeigen", name: enabled, widget: boolean, default: true, required: false, hint: "Nur echte Auftraggeber zeigen. Aus = Eintrag bleibt gespeichert, erscheint aber nicht auf der Website." }
      - { label: "Reihenfolge", name: order, widget: number, value_type: int, default: 10 }

  # ---------------------------------------------------------------- Seiten
  - name: "seiten"
    label: "Seiten & Einstellungen"
    files:
      - name: "settings"
        label: "Allgemein, Einstieg & Filme"
        file: "content/settings.json"
        fields:
          - { label: "Für Suchmaschinen freigeben", name: launch, widget: boolean, default: false, hint: "Erst einschalten, wenn Domain, Impressum und Datenschutz stehen" }
          - { label: "Adresse der Website", name: siteUrl, widget: string, required: false, hint: "z. B. https://bushyfam-studios.de – nötig für Sitemap und Link-Vorschau" }
          - { label: "Studioname", name: brandName, widget: string }
          - { label: "Ort (DE)", name: location_de, widget: string }
          - { label: "Ort (EN)", name: location_en, widget: string }
          - { label: "Ort (TR)", name: location_tr, widget: string, required: false }
          - { label: "Einzugsgebiet (DE)", name: reach_de, widget: string }
          - { label: "Einzugsgebiet (EN)", name: reach_en, widget: string }
          - { label: "Einzugsgebiet (TR)", name: reach_tr, widget: string, required: false }
          - { label: "E-Mail", name: email, widget: string, required: false, hint: "Wird angezeigt, sobald sie eingetragen ist" }
          - { label: "WhatsApp-Nummer", name: whatsapp, widget: string, required: false, hint: "Mit Ländervorwahl, z. B. +49 1514 4930658 – leer lassen, um WhatsApp auszublenden" }
          - { label: "Instagram-Adresse", name: instagramUrl, widget: string, required: false }
          - { label: "Instagram-Name", name: instagramHandle, widget: string, required: false }
          - label: "Anschrift (wie im Impressum)"
            name: address
            widget: object
            required: false
            hint: "Für die strukturierten Daten (Google). Bei Umzug hier UND im Impressum ändern."
            fields:
              - { label: "Straße und Hausnummer", name: street, widget: string }
              - { label: "PLZ", name: postalCode, widget: string }
              - { label: "Ort", name: city, widget: string }
              - { label: "Land (Kürzel)", name: country, widget: string, default: "DE" }
          - label: "Suchmaschinen-Text"
            name: seo
            widget: object
            fields:
              - { label: "Seitentitel (DE)", name: title_de, widget: string }
              - { label: "Seitentitel (EN)", name: title_en, widget: string }
              - { label: "Seitentitel (TR)", name: title_tr, widget: string, required: false }
              - { label: "Beschreibung (DE)", name: description_de, widget: text, hint: "ca. 150–160 Zeichen" }
              - { label: "Beschreibung (EN)", name: description_en, widget: text }
              - { label: "Beschreibung (TR)", name: description_tr, widget: text, required: false }
              - { label: "Vorschaubild zum Teilen", name: image, widget: image, required: false, hint: "Erscheint, wenn jemand die Seite auf WhatsApp, Instagram usw. teilt. Am besten 1200 × 630 px" }
          - label: "Einstieg"
            name: hero
            widget: object
            fields:
              - { label: "Überschrift Zeile 1 (DE)", name: line1_de, widget: string, hint: "Große Überschrift über dem Film, z. B. der Slogan. Das Logo oben links trägt den Namen." }
              - { label: "Überschrift Zeile 2 (DE)", name: line2_de, widget: string, required: false, hint: "Optional – leer lassen für eine ruhigere erste Ansicht" }
              - { label: "Überschrift Zeile 1 (EN)", name: line1_en, widget: string }
              - { label: "Überschrift Zeile 1 (TR)", name: line1_tr, widget: string, required: false }
              - { label: "Überschrift Zeile 2 (EN)", name: line2_en, widget: string, required: false }
              - { label: "Überschrift Zeile 2 (TR)", name: line2_tr, widget: string, required: false }
              - { label: "Kleine Zeile darunter (DE)", name: text_de, widget: text, required: false, hint: "Optional – leer lassen, wenn die Überschrift schon der Slogan ist" }
              - { label: "Kleine Zeile darunter (EN)", name: text_en, widget: text, required: false }
              - { label: "Kleine Zeile darunter (TR)", name: text_tr, widget: text, required: false }
              - { label: "Satz am Filmende (DE)", name: outro_de, widget: text, required: false }
              - { label: "Satz am Filmende (EN)", name: outro_en, widget: text, required: false }
              - { label: "Satz am Filmende (TR)", name: outro_tr, widget: text, required: false }
              - label: "Film"
                name: video
                widget: object
                hint: "Scrub-optimierte Dateien – Austausch bitte abstimmen"
                fields:
                  - label: "Dateien"
                    name: sources
                    widget: list
                    fields:
                      - { label: "Datei", name: src, widget: file }
                      - { label: "Breite (px)", name: width, widget: number, value_type: int }
                      - { label: "Nur Desktop", name: desktopOnly, widget: boolean, required: false, default: false }
                  - label: "Einzelbilder fürs Handy"
                    name: frames
                    widget: object
                    required: false
                    collapsed: true
                    hint: "Ruckelfreies Scrollen auf Telefonen. Werden automatisch nicht verwendet, sobald der Film ausgetauscht wird (dann läuft das Video)."
                    fields:
                      - { label: "Ordner", name: folder, widget: string, required: false }
                      - { label: "Anzahl Bilder", name: count, widget: number, value_type: int, required: false }
                      - { label: "Gehört zu Datei", name: forVideo, widget: string, required: false }
                  - { label: "Standbild", name: poster, widget: image }
                  - { label: "Breite (px)", name: width, widget: number, value_type: int }
                  - { label: "Höhe (px)", name: height, widget: number, value_type: int }
                  - { label: "Filmbeschreibung (DE)", name: description_de, widget: text }
                  - { label: "Filmbeschreibung (EN)", name: description_en, widget: text }
                  - { label: "Filmbeschreibung (TR)", name: description_tr, widget: text, required: false }
          - label: "Abschlussfilm"
            name: ending
            widget: object
            fields:
              - { label: "Anzeigen", name: enabled, widget: boolean, default: true }
              - label: "Film"
                name: video
                widget: object
                fields:
                  - label: "Dateien"
                    name: sources
                    widget: list
                    fields:
                      - { label: "Datei", name: src, widget: file }
                      - { label: "Breite (px)", name: width, widget: number, value_type: int }
                      - { label: "Nur Desktop", name: desktopOnly, widget: boolean, required: false, default: false }
                  - { label: "Standbild", name: poster, widget: image }
                  - { label: "Breite (px)", name: width, widget: number, value_type: int }
                  - { label: "Höhe (px)", name: height, widget: number, value_type: int }
                  - { label: "Filmbeschreibung (DE)", name: description_de, widget: text }
                  - { label: "Filmbeschreibung (EN)", name: description_en, widget: text }
                  - { label: "Filmbeschreibung (TR)", name: description_tr, widget: text, required: false }
          - label: "Showreel"
            name: showreel
            widget: object
            hint: "Erscheint auf der Startseite, sobald eingeschaltet und eine Datei hinterlegt ist"
            fields:
              - { label: "Anzeigen", name: enabled, widget: boolean, default: false }
              - { label: "Film (MP4)", name: src, widget: file, required: false }
              - { label: "Standbild", name: poster, widget: image, required: false }
              - { label: "Länge", name: duration, widget: string, required: false, hint: "z. B. 00:45" }
              - { label: "Titel (DE)", name: title_de, widget: string, required: false }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }
              - { label: "Titel (TR)", name: title_tr, widget: string, required: false }

      - name: "home"
        label: "Startseite"
        file: "content/home.json"
        fields:
          - { label: "Überschrift Arbeiten (DE)", name: workTitle_de, widget: string }
          - { label: "Überschrift Arbeiten (EN)", name: workTitle_en, widget: string }
          - { label: "Überschrift Arbeiten (TR)", name: workTitle_tr, widget: string, required: false }
          - { label: "Kurztext über Taha (DE)", name: aboutText_de, widget: text }
          - { label: "Kurztext über Taha (EN)", name: aboutText_en, widget: text }
          - { label: "Kurztext über Taha (TR)", name: aboutText_tr, widget: text, required: false }
          - { label: "Abschluss-Überschrift (DE)", name: ctaTitle_de, widget: string }
          - { label: "Abschluss-Überschrift (EN)", name: ctaTitle_en, widget: string }
          - { label: "Abschluss-Überschrift (TR)", name: ctaTitle_tr, widget: string, required: false }
          - { label: "Abschlusstext (DE)", name: ctaText_de, widget: text }
          - { label: "Abschlusstext (EN)", name: ctaText_en, widget: text }
          - { label: "Abschlusstext (TR)", name: ctaText_tr, widget: text, required: false }
          - { label: "„So läuft’s“ – Überschrift (DE)", name: processTitle_de, widget: string, required: false, hint: "Block direkt unter den Leistungen. Leer lassen = Block ausblenden." }
          - { label: "„So läuft’s“ – Überschrift (EN)", name: processTitle_en, widget: string, required: false }
          - { label: "„So läuft’s“ – Einleitungssatz (DE)", name: processLead_de, widget: string, required: false }
          - { label: "„So läuft’s“ – Einleitungssatz (EN)", name: processLead_en, widget: string, required: false }
          - label: "„So läuft’s“ – Schritte"
            name: processSteps
            widget: list
            required: false
            summary: "{{title_de}}"
            fields:
              - { label: "Schritt (DE)", name: title_de, widget: string }
              - { label: "Schritt (EN)", name: title_en, widget: string, required: false }
              - { label: "Große Zeitmarke (DE)", name: figure_de, widget: string, required: false, hint: "Kurz halten, z. B. „Jetzt“, „20 Min.“, „48 h“. Leer = Schrittname wird groß gezeigt." }
              - { label: "Große Zeitmarke (EN)", name: figure_en, widget: string, required: false }
              - { label: "Text (DE)", name: text_de, widget: text }
              - { label: "Text (EN)", name: text_en, widget: text, required: false }

      - name: "showcase"
        label: "Leistungen im All (Startseite)"
        file: "content/showcase.json"
        description: "Die Stationen im Flug auf der Startseite: je eine Leistung, gezeigt mit eurer Arbeit als Dekoration. Keine Kundennamen nötig."
        fields:
          - { label: "Überschrift (DE)", name: title_de, widget: string }
          - { label: "Überschrift (EN)", name: title_en, widget: string }
          - { label: "Überschrift (TR)", name: title_tr, widget: string, required: false }
          - { label: "Einleitungssatz (DE)", name: lead_de, widget: text, required: false }
          - { label: "Einleitungssatz (EN)", name: lead_en, widget: text, required: false }
          - { label: "Einleitungssatz (TR)", name: lead_tr, widget: text, required: false }
          - label: "Stationen"
            name: stations
            widget: list
            summary: "{{title_de}}"
            fields:
              - label: "Darstellung"
                name: kind
                widget: select
                options:
                  - { label: "Smartphone mit Feed (Clips wischen automatisch weiter)", value: "feed" }
                  - { label: "Kinoleinwand (Querformat-Clips wechseln)", value: "cinema" }
                  - { label: "Kartenstapel (Bilder oder Clips)", value: "cards" }
                  - { label: "Einzelbild (schwebt leicht)", value: "still" }
                  - { label: "Bullauge (ein Clip, rund)", value: "porthole" }
              - { label: "Bilder ganz zeigen (für Logos)", name: fit, widget: select, required: false, options: [{ label: "Füllen", value: "cover" }, { label: "Ganz zeigen", value: "contain" }] }
              - { label: "Überschrift (DE)", name: title_de, widget: string }
              - { label: "Überschrift (EN)", name: title_en, widget: string, required: false }
              - { label: "Überschrift (TR)", name: title_tr, widget: string, required: false }
              - { label: "Satz dazu (DE)", name: text_de, widget: text, required: false }
              - { label: "Satz dazu (EN)", name: text_en, widget: text, required: false }
              - { label: "Satz dazu (TR)", name: text_tr, widget: text, required: false }
              - label: "Clips & Bilder"
                name: media
                widget: list
                summary: "{{src}}"
                fields:
                  - { label: "Datei (MP4 oder Bild)", name: src, widget: file }
                  - { label: "Vorschaubild für Clips (optional)", name: poster, widget: image, required: false, hint: "Leer = gleichnamige .jpg neben dem Clip, falls vorhanden" }

      - name: "packages"
        label: "Pakete"
        file: "content/packages.json"
        fields:
          - { label: "Pakete auf der Website zeigen", name: enabled, widget: boolean, default: true, required: false, hint: "Aus = kein Paket-Bereich auf der Startseite und keine Paketauswahl im Kontaktformular. Die Pakete bleiben hier gespeichert." }
          - { label: "Überschrift (DE)", name: title_de, widget: string }
          - { label: "Überschrift (EN)", name: title_en, widget: string, required: false }
          - label: "Pakete"
            name: items
            widget: list
            summary: "{{name_de}} – {{price_de}}"
            hint: "Ein Paket erscheint erst, wenn ein Preis eingetragen ist. Ohne sichtbares Paket bleibt der ganze Bereich ausgeblendet."
            fields:
              - { label: "Kürzel (für den Link zum Formular)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"] }
              - { label: "Name (DE)", name: name_de, widget: string }
              - { label: "Name (EN)", name: name_en, widget: string, required: false }
              - { label: "Kurzbeschreibung (DE)", name: text_de, widget: string }
              - { label: "Kurzbeschreibung (EN)", name: text_en, widget: string, required: false }
              - { label: "Leistungspunkte (DE)", name: points_de, widget: list, field: { label: "Punkt", name: point, widget: string }, hint: "3–4 kurze Punkte. Punkte mit [TODO: …] werden nicht angezeigt." }
              - { label: "Leistungspunkte (EN)", name: points_en, widget: list, required: false, field: { label: "Punkt", name: point, widget: string } }
              - { label: "Hervorheben", name: highlight, widget: boolean, required: false, default: false, hint: "Hebt dieses Paket mit hellerer Karte und gefülltem Knopf hervor – am besten nur eines" }
              - { label: "Preis (DE)", name: price_de, widget: string, required: false, hint: "So wie er erscheinen soll, z. B. „ab 1.190 € / Monat“. Leer = Paket wird nicht angezeigt." }
              - { label: "Preis (EN)", name: price_en, widget: string, required: false, hint: "z. B. „from €1,190 / month“" }
              - { label: "Kleiner Hinweis unter dem Preis (DE)", name: note_de, widget: string, required: false, hint: "z. B. „zzgl. Domain & Hosting“" }
              - { label: "Kleiner Hinweis unter dem Preis (EN)", name: note_en, widget: string, required: false }
              - label: "Zuschaltbare Option (optional)"
                name: addon
                widget: object
                required: false
                collapsed: true
                hint: "Erscheint als Schalter in der Karte; beim Einschalten wechselt der Preis und die Anfrage nennt die Variante"
                fields:
                  - { label: "Kürzel der Variante", name: id, widget: string, required: false, hint: "z. B. website-fotoshooting" }
                  - { label: "Schalter-Text (DE)", name: label_de, widget: string, required: false, hint: "z. B. „Mit Fotoshooting vor Ort“" }
                  - { label: "Schalter-Text (EN)", name: label_en, widget: string, required: false }
                  - { label: "Aufpreis-Anzeige (DE)", name: extra_de, widget: string, required: false, hint: "z. B. „+ 400 €“" }
                  - { label: "Aufpreis-Anzeige (EN)", name: extra_en, widget: string, required: false }
                  - { label: "Preis mit Option (DE)", name: price_de, widget: string, required: false, hint: "z. B. „ab 2.190 €“ – leer = Schalter erscheint nicht" }
                  - { label: "Preis mit Option (EN)", name: price_en, widget: string, required: false }
                  - { label: "Name der Variante im Formular (DE)", name: name_de, widget: string, required: false, hint: "z. B. „Website + Fotoshooting“" }
                  - { label: "Name der Variante im Formular (EN)", name: name_en, widget: string, required: false }
          - { label: "Hinweis unter den Paketen (DE)", name: vatNote_de, widget: string, required: false, hint: "Klein unter den Paketen, z. B. „Alle Preise zzgl. MwSt.“" }
          - { label: "Hinweis unter den Paketen (EN)", name: vatNote_en, widget: string, required: false }
          - { label: "Satz unter den Paketen (DE)", name: note_de, widget: string, required: false }
          - { label: "Satz unter den Paketen (EN)", name: note_en, widget: string, required: false }

      - name: "services"
        label: "Leistungen"
        file: "content/services.json"
        media_folder: "/assets/uploads/services"
        public_folder: "/assets/uploads/services"
        fields:
          - { label: "Überschrift (DE)", name: title_de, widget: string, required: false }
          - { label: "Überschrift (EN)", name: title_en, widget: string, required: false }
          - { label: "Überschrift (TR)", name: title_tr, widget: string, required: false }
          - label: "Leistungen"
            name: items
            widget: list
            summary: "{{title_de}}"
            fields:
              - { label: "Begriff (DE)", name: title_de, widget: string }
              - { label: "Begriff (EN)", name: title_en, widget: string, required: false }
              - { label: "Begriff (TR)", name: title_tr, widget: string, required: false }
              - { label: "Erklärung (DE)", name: text_de, widget: text }
              - { label: "Erklärung (EN)", name: text_en, widget: text, required: false }
              - { label: "Erklärung (TR)", name: text_tr, widget: text, required: false }
              - { label: "Stichworte (DE)", name: tags_de, widget: string, required: false, hint: "z. B. Werbefilme · Reels · Schnitt" }
              - { label: "Stichworte (EN)", name: tags_en, widget: string, required: false }
              - { label: "Stichworte (TR)", name: tags_tr, widget: string, required: false }
              - { label: "Kachelbild", name: image, widget: image, required: false, hint: "Hochformat (3:4) wirkt am besten. Beim Video ist das Bild das Standbild." }
              - { label: "Kachelvideo (optional)", name: video, widget: file, required: false, hint: "Kurzer stummer Clip als MP4, läuft in Schleife. Ohne Video wird das Bild gezeigt." }
              - { label: "Bildbeschreibung (DE)", name: imageAlt_de, widget: string, required: false }
              - { label: "Bildbeschreibung (EN)", name: imageAlt_en, widget: string, required: false }
              - { label: "Bildbeschreibung (TR)", name: imageAlt_tr, widget: string, required: false }
          - { label: "Zusatzsatz unter den Leistungen (DE)", name: note_de, widget: text, required: false, hint: "Erscheint als große Zeile mit Pfeil zum Kontakt. Alles bis zum ersten Fragezeichen steht klein darüber, der Rest groß." }
          - { label: "Zusatzsatz unter den Leistungen (EN)", name: note_en, widget: text, required: false }
          - { label: "Zusatzsatz unter den Leistungen (TR)", name: note_tr, widget: text, required: false }

      - name: "studio"
        label: "Studio (Taha & Stationen)"
        file: "content/studio.json"
        media_folder: "/assets/uploads/studio"
        public_folder: "/assets/uploads/studio"
        fields:
          - { label: "Name", name: name, widget: string }
          - { label: "Rolle (DE)", name: role_de, widget: string }
          - { label: "Rolle (EN)", name: role_en, widget: string }
          - { label: "Rolle (TR)", name: role_tr, widget: string, required: false }
          - { label: "Großes Statement ganz oben (DE)", name: statement_de, widget: text, required: false, hint: "Ein großer, kurzer Satz – erscheint sehr groß direkt unter dem Namen" }
          - { label: "Großes Statement ganz oben (EN)", name: statement_en, widget: text, required: false }
          - { label: "Großes Statement ganz oben (TR)", name: statement_tr, widget: text, required: false }
          - { label: "Einleitung (DE)", name: lead_de, widget: text }
          - { label: "Einleitung (EN)", name: lead_en, widget: text }
          - { label: "Einleitung (TR)", name: lead_tr, widget: text, required: false }
          - label: "Porträt"
            name: portrait
            widget: object
            fields:
              - { label: "Bild", name: src, widget: image }
              - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string }
              - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
              - { label: "Bildbeschreibung (TR)", name: alt_tr, widget: string, required: false }
          - label: "Absätze"
            name: paragraphs
            widget: list
            summary: "{{de}}"
            fields:
              - { label: "Text (DE)", name: de, widget: text }
              - { label: "Text (EN)", name: en, widget: text, required: false }
              - { label: "Text (TR)", name: tr, widget: text, required: false }
          - { label: "Überschrift Stationen (DE)", name: stationsTitle_de, widget: string }
          - { label: "Überschrift Stationen (EN)", name: stationsTitle_en, widget: string }
          - { label: "Überschrift Stationen (TR)", name: stationsTitle_tr, widget: string, required: false }
          - label: "Stationen & Projekte"
            name: stations
            widget: list
            required: false
            summary: "{{title_de}}"
            fields:
              - { label: "Zeitangabe (DE)", name: year_de, widget: string, required: false }
              - { label: "Zeitangabe (EN)", name: year_en, widget: string, required: false }
              - { label: "Zeitangabe (TR)", name: year_tr, widget: string, required: false }
              - label: "Kategorie (optional)"
                name: category
                widget: select
                required: false
                options: ["Art", "Exhibition", "Publishing", "Film", "BushyFam"]
              - { label: "Groß darstellen", name: feature, widget: boolean, default: false, required: false, hint: "Großes Bild mit Text daneben – für die stärksten Momente wie Museum und Buch. Ohne Häkchen: ruhige Textnotiz" }
              - { label: "Titel (DE)", name: title_de, widget: string }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }
              - { label: "Titel (TR)", name: title_tr, widget: string, required: false }
              - { label: "Text (DE)", name: text_de, widget: text }
              - { label: "Text (EN)", name: text_en, widget: text, required: false }
              - { label: "Text (TR)", name: text_tr, widget: text, required: false }
              - label: "Bild"
                name: image
                widget: object
                required: false
                fields:
                  - { label: "Bild", name: src, widget: image, required: false }
                  - { label: "Bildbeschreibung (DE)", name: alt_de, widget: string, required: false }
                  - { label: "Bildbeschreibung (EN)", name: alt_en, widget: string, required: false }
                  - { label: "Bildbeschreibung (TR)", name: alt_tr, widget: string, required: false }
              - label: "Link"
                name: link
                widget: object
                required: false
                fields:
                  - { label: "Adresse", name: url, widget: string, required: false }
                  - { label: "Beschriftung (DE)", name: label_de, widget: string, required: false }
                  - { label: "Beschriftung (EN)", name: label_en, widget: string, required: false }
                  - { label: "Beschriftung (TR)", name: label_tr, widget: string, required: false }
                  - { label: "Hinweis (DE)", name: note_de, widget: string, required: false, hint: "z. B. Werbelink – bei Affiliate-Links Pflicht" }
                  - { label: "Hinweis (EN)", name: note_en, widget: string, required: false }
                  - { label: "Hinweis (TR)", name: note_tr, widget: string, required: false }
          - { label: "Überschrift Zusammenarbeit (DE)", name: processTitle_de, widget: string }
          - { label: "Überschrift Zusammenarbeit (EN)", name: processTitle_en, widget: string }
          - { label: "Überschrift Zusammenarbeit (TR)", name: processTitle_tr, widget: string, required: false }
          - label: "Schritte der Zusammenarbeit"
            name: process
            widget: list
            summary: "{{title_de}}"
            fields:
              - { label: "Titel (DE)", name: title_de, widget: string }
              - { label: "Titel (EN)", name: title_en, widget: string, required: false }
              - { label: "Titel (TR)", name: title_tr, widget: string, required: false }
              - { label: "Text (DE)", name: text_de, widget: text }
              - { label: "Text (EN)", name: text_en, widget: text, required: false }
              - { label: "Text (TR)", name: text_tr, widget: text, required: false }

      - name: "contact"
        label: "Kontaktseite"
        file: "content/contact.json"
        fields:
          - { label: "Überschrift (DE)", name: title_de, widget: string }
          - { label: "Überschrift (EN)", name: title_en, widget: string }
          - { label: "Überschrift (TR)", name: title_tr, widget: string, required: false }
          - { label: "Einleitung (DE)", name: intro_de, widget: text }
          - { label: "Einleitung (EN)", name: intro_en, widget: text }
          - { label: "Einleitung (TR)", name: intro_tr, widget: text, required: false }
          - label: "Auswahl „Worum geht es?“"
            name: options
            widget: list
            summary: "{{de}}"
            fields:
              - { label: "Bezeichnung (DE)", name: de, widget: string }
              - { label: "Bezeichnung (EN)", name: en, widget: string, required: false }
              - { label: "Bezeichnung (TR)", name: tr, widget: string, required: false }
              - { label: "Steht für Besetzung/Talent", name: cast, widget: boolean, required: false, default: false, hint: "Wird automatisch ausgewählt, wenn jemand über „Diese Person anfragen“ kommt." }

      - name: "legal"
        label: "Impressum & Datenschutz"
        file: "content/legal.json"
        fields:
          - { label: "Impressum (DE)", name: imprint_de, widget: text, required: false, hint: "Leerzeile = neuer Absatz. Eine Zeile, die mit ## beginnt, wird zur Zwischenüberschrift." }
          - { label: "Impressum (EN)", name: imprint_en, widget: text, required: false }
          - { label: "Impressum (TR)", name: imprint_tr, widget: text, required: false }
          - { label: "Datenschutz (DE)", name: privacy_de, widget: text, required: false }
          - { label: "Datenschutz (EN)", name: privacy_en, widget: text, required: false }
          - { label: "Datenschutz (TR)", name: privacy_tr, widget: text, required: false }
